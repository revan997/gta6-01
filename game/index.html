<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solmar Bay</title>
<link rel="icon" href="favicon.ico" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; }
  #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #fff; }
  .hidden { display: none !important; }
  #start-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45); pointer-events: auto; }
  #start-screen h1 { margin: 0 0 8px; font-size: 64px; letter-spacing: 4px; color: #ffd24a; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8); }
  #start-screen p { margin: 0 0 24px; font-size: 18px; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
  #start-button { pointer-events: auto; cursor: pointer; font-size: 22px; font-weight: bold; padding: 14px 44px; border: 2px solid #ffd24a; background: #ff2a1a; color: #fff; border-radius: 6px; }
  #pause-menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); pointer-events: auto; }
  #pause-menu h2 { font-size: 42px; color: #ffd24a; margin: 0 0 12px; }
  #pause-menu p { color: #fff; }
  #hud-dialogue { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 640px; background: rgba(0, 0, 0, 0.65); border-left: 4px solid #ffd24a; padding: 8px 14px; font-size: 16px; line-height: 1.4; }
  #hud-radio { position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: bold; color: #ffd24a; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  #clock-time { position: absolute; right: 14px; top: 12px; font-size: 20px; font-weight: bold; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  #hud-mission-panel { position: absolute; left: 14px; top: 12px; background: rgba(0, 0, 0, 0.55); padding: 8px 12px; font-size: 14px; line-height: 1.5; max-width: 420px; }
  #hud-respect { position: absolute; left: 14px; top: 86px; font-size: 13px; font-weight: bold; color: #7dff9e; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  #hud-vehicle-panel { position: absolute; left: 14px; bottom: 48px; font-size: 13px; font-weight: bold; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  #hud-police-response { position: absolute; right: 14px; top: 46px; font-size: 13px; font-weight: bold; color: #ff8a7a; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); text-align: right; }
  #hud-crew-panel { position: absolute; right: 14px; bottom: 48px; font-size: 13px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); text-align: right; }
  #hud-district-panel { position: absolute; right: 14px; bottom: 12px; font-size: 13px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); text-align: right; }
  #hud-minimap { position: absolute; right: 14px; top: 84px; width: 168px; height: 168px; border: 2px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.35); }
  #message { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); font-size: 18px; font-weight: bold; color: #ffd24a; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  #controls-hint { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 13px; color: rgba(255, 255, 255, 0.75); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  #shot-banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 34px; font-weight: bold; letter-spacing: 3px; color: #ff2a1a; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); }
  #crosshair { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #ff2a1a; }
  #crosshair::before { left: 13px; top: 0; width: 2px; height: 28px; }
  #crosshair::after { top: 13px; left: 0; width: 28px; height: 2px; }
  #speed, #hud-ammo { display: none; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud">
  <div id="hud-mission-panel"></div>
  <div id="hud-respect"></div>
  <div id="hud-vehicle-panel"></div>
  <div id="hud-police-response"></div>
  <div id="hud-crew-panel"></div>
  <div id="hud-district-panel"></div>
  <canvas id="hud-minimap" width="168" height="168"></canvas>
  <div id="clock-time"></div>
  <div id="hud-radio">SOLMAR FM 101.5</div>
  <div id="hud-dialogue" style="display: none"></div>
  <div id="message"></div>
  <div id="controls-hint">WASD drive &middot; Space brake &middot; P pause &middot; R radio</div>
  <div id="shot-banner" style="display: none"></div>
  <div id="crosshair" class="hidden"></div>
  <span id="speed" style="display: none"></span>
  <span id="hud-ammo" style="display: none"></span>
</div>
<div id="start-screen">
  <h1>SOLMAR BAY</h1>
  <p>Four stars. One harbour. No way out but through.</p>
  <button id="start-button">START ENGINE</button>
</div>
<div id="pause-menu" class="hidden">
  <h2>PAUSED</h2>
  <p>Press P to resume.</p>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
