<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay</title>
<link rel="icon" href="./favicon.ico">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The HUD root: hud.js builds every panel inside #hud. */
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Segoe UI', system-ui, sans-serif; color: #f5efe4; z-index: 10; }
  #hud-root { position: absolute; inset: 0; }
  #hud-minimap { position: absolute; left: 16px; bottom: 16px; width: 168px; height: 168px; border: 2px solid rgba(255,255,255,0.35); border-radius: 6px; background: rgba(0,0,0,0.45); }
  #hud-mission-panel { position: absolute; left: 16px; top: 16px; background: rgba(10,10,16,0.72); border-left: 3px solid #ffd76a; padding: 10px 14px; font-size: 13px; line-height: 1.5; max-width: 340px; }
  #hud-respect { position: absolute; right: 16px; top: 16px; background: rgba(10,10,16,0.72); padding: 8px 12px; font-size: 12px; }
  #hud-vehicle-panel { position: absolute; right: 16px; top: 64px; background: rgba(10,10,16,0.72); padding: 8px 12px; font-size: 12px; }
  #hud-police-response { position: absolute; right: 16px; top: 108px; background: rgba(60,0,0,0.72); padding: 8px 12px; font-size: 12px; }
  #hud-crew-panel { position: absolute; left: 16px; bottom: 200px; background: rgba(10,10,16,0.6); padding: 6px 10px; font-size: 12px; }
  #hud-district-panel { position: absolute; left: 200px; bottom: 16px; background: rgba(10,10,16,0.6); padding: 6px 10px; font-size: 12px; }
  #hud-dialogue { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); background: rgba(10,10,16,0.8); padding: 10px 18px; font-size: 14px; max-width: 640px; text-align: center; }
  #hud-radio { position: absolute; right: 16px; bottom: 16px; background: rgba(10,10,16,0.72); padding: 6px 10px; font-size: 12px; }
  #hud-banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: rgba(160,0,0,0.85); color: #fff; padding: 8px 22px; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  #message { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); font-size: 15px; }
  #controls-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.65); }
  #crosshair { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; font-size: 20px; line-height: 24px; text-align: center; color: #fff; text-shadow: 0 0 4px #000; }
  #start-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,6,10,0.72); pointer-events: auto; }
  #start-screen.hidden { display: none; }
  #hud-start-title { font-size: 64px; font-weight: 800; letter-spacing: 6px; color: #ffd76a; }
  #hud-start-sub { font-size: 16px; margin: 12px 0 28px; color: #e8e0d0; }
  #start-button { font-size: 20px; padding: 12px 44px; background: #ffd76a; color: #1a1410; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; }
  #crosshair.hidden { display: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: drive, steal cars, lose the police, run the crew's jobs"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
